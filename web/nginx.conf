server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # /api/... vai para o container da API (igual ao vercel.json em produção)
  location /api/ {
    proxy_pass http://api:3333;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Tempo real (Server-Sent Events): não acumular a resposta
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  # Qualquer rota do app (ex: /receitas/123) devolve o index.html para o React cuidar
  location / {
    try_files $uri $uri/ /index.html;
  }
}
