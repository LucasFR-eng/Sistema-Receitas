name: recipelens

services:
  # Banco de dados PostgreSQL
  # Porta 5433 no seu computador (a 5432 já é usada por um Postgres instalado no Windows)
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recipelens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recipelens}
      POSTGRES_DB: ${POSTGRES_DB:-recipelens}
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recipelens}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # API e front rodando dentro do Docker (opcional).
  # No dia a dia, rode-os com `npm run dev` para ter recarregamento instantâneo.
  # Para subir tudo no Docker: docker compose --profile app up --build
  api:
    profiles: ["app"]
    build: ./api
    env_file: ./api/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-recipelens}:${POSTGRES_PASSWORD:-recipelens}@db:5432/${POSTGRES_DB:-recipelens}
    ports:
      - "3333:3333"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    profiles: ["app"]
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  db_data:
  uploads:
